pythonJob:
  enabled: false
  name: "python-job"
  scriptContent: ""
  requirementsContent: ""
  # Optional: base64 zip of the job's Python packages (unpacked onto PYTHONPATH in the pod)
  packageContent: ""
  # Optional: environment variables for the job, delivered through a Kubernetes Secret
  env: {}
  # Optional: Kubernetes service account for the job, e.g. one linked to an IAM role by EKS Pod Identity
  serviceAccount: ""
  backoffLimit: 4
  ttlSecondsAfterFinished: 100
  restartPolicy: Never
  image:
    repository: jupyter/all-spark-notebook
    pullPolicy: IfNotPresent
    tag: "latest"
  resources:
    limits:
      cpu: 1.0
      memory: 2Gi
    requests:
      cpu: 0.5
      memory: 1Gi
