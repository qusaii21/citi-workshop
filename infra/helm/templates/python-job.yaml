{{- if .Values.pythonJob.enabled }}
{{- if .Values.pythonJob.scriptContent }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "name" . }}-{{ .Values.pythonJob.name }}-source
  labels:
    {{- include "labels" . | nindent 4 }}
data:
  job.py: |
    {{ .Values.pythonJob.scriptContent | nindent 4 }}
  requirements.txt: |
    {{ .Values.pythonJob.requirementsContent | nindent 4 }}
  {{- if .Values.pythonJob.packageContent }}
  package.zip.b64: |
    {{ .Values.pythonJob.packageContent | nindent 4 }}
  {{- end }}
---
{{- end }}
{{- if .Values.pythonJob.env }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "name" . }}-{{ .Values.pythonJob.name }}-env
  labels:
    {{- include "labels" . | nindent 4 }}
type: Opaque
stringData:
  {{- range $key, $value := .Values.pythonJob.env }}
  {{ $key }}: {{ $value | toString | quote }}
  {{- end }}
---
{{- end }}
{{- if .Values.pythonJob.serviceAccount }}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ .Values.pythonJob.serviceAccount }}
  labels:
    {{- include "labels" . | nindent 4 }}
---
{{- end }}
apiVersion: batch/v1
kind: Job
metadata:
  name: {{ include "name" . }}-{{ .Values.pythonJob.name }}
  labels:
    {{- include "labels" . | nindent 4 }}
spec:
  template:
    metadata:
      labels:
        {{- include "labels" . | nindent 8 }}
    spec:
      {{- if .Values.pythonJob.serviceAccount }}
      serviceAccountName: {{ .Values.pythonJob.serviceAccount }}
      {{- end }}
      containers:
        - name: {{ include "name" . }}-{{ .Values.pythonJob.name }}
          image: {{ .Values.pythonJob.image.repository }}:{{ .Values.pythonJob.image.tag }}
          imagePullPolicy: {{ .Values.pythonJob.image.pullPolicy }}
          command: ["sh", "-c"]
          args:
            - |
              if [ -f /app/requirements.txt ]; then
                echo "Installing pipeline dependencies from requirements.txt..."
                pip install --no-cache-dir -r /app/requirements.txt
              fi
              if [ -f /app/package.zip.b64 ]; then
                echo "Unpacking the job's Python package..."
                base64 -d /app/package.zip.b64 > /tmp/package.zip
                export PYTHONPATH="/tmp/package.zip${PYTHONPATH:+:$PYTHONPATH}"
              fi
              python /app/job.py
          {{- if .Values.pythonJob.env }}
          envFrom:
            - secretRef:
                name: {{ include "name" . }}-{{ .Values.pythonJob.name }}-env
          {{- end }}
          {{- if .Values.pythonJob.scriptContent }}
          volumeMounts:
            - name: script
              mountPath: /app
          {{- end }}
          resources:
            limits:
              cpu: {{ .Values.pythonJob.resources.limits.cpu }}
              memory: {{ .Values.pythonJob.resources.limits.memory }}
            requests:
              cpu: {{ .Values.pythonJob.resources.requests.cpu }}
              memory: {{ .Values.pythonJob.resources.requests.memory }}
      {{- if .Values.pythonJob.scriptContent }}
      volumes:
        - name: script
          configMap:
            name: {{ include "name" . }}-{{ .Values.pythonJob.name }}-source
      {{- end }}
      restartPolicy: {{ .Values.pythonJob.restartPolicy }}
  backoffLimit: {{ .Values.pythonJob.backoffLimit }}
  ttlSecondsAfterFinished: {{ .Values.pythonJob.ttlSecondsAfterFinished }}
{{- end }}
